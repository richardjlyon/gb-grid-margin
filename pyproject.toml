[project]
name = "grid-gauge"
version = "0.2.0"
description = "Live GB grid mix verdict — every figure traces to Elexon/NESO."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13",
]

[dependency-groups]
dev = [
    "playwright>=1.61",  # 1.61: first with Ubuntu 26.04, the refresh run's image (aios-harness#149)
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
